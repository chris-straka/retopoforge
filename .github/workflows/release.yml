name: release

on:
  push:
    branches:
      - main
      - ci
    tags:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build-test:
    # Linux CI is compile + test validation only (the shipped product is
    # macOS-only): engine + CLI, no packaging.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM, CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm cmake ninja-build
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libtbb-dev
      - name: Build engine and CLI
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j`nproc`
      - name: Fetch benchmark models
        run: ./bench/fetch_models.sh
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
      - name: Check benchmarks
        run: ./bench/run.py --check bench/baseline-linux.json

  macos-upload:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM and Ninja
        run: |
          brew install llvm ninja
      - name: Install TBB
        run: |
          brew install tbb
      - name: Build engine and CLI
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/macos-llvm.cmake \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Fetch benchmark models
        run: ./bench/fetch_models.sh
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
      - name: Check benchmarks
        run: ./bench/run.py --check bench/baseline.json
      - name: Headless CLI smoke test
        run: |
          set -e
          ./build/cli/retopo \
            --input bench/models/armadillo.obj \
            --output retopo-cli-smoke.obj \
            --target-quads 2000
          test -f retopo-cli-smoke.obj
      - name: Assemble Blender extension zip
        run: |
          set -e
          rm -rf blender/retopoforge/__pycache__
          cd blender && zip -r -X ../retopoforge-blender-extension.zip retopoforge
      # The CLI artifact needs brew tbb + llvm installed to run (it links
      # them dynamically); for a managed install use the Homebrew formula.
      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: retopoforge-${{ github.ref_name }}-macos-cli
          path: build/cli/retopo
      - name: Upload Blender extension
        uses: actions/upload-artifact@v4
        with:
          name: retopoforge-blender-extension.zip
          path: retopoforge-blender-extension.zip
