name: release

on:
  push:
    branches:
      - main
      - ci
    tags:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build-test:
    # Linux CI is compile + bench validation only (the shipped product is
    # macOS-only): no packaging.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --locked --release --manifest-path rust/Cargo.toml -p retopo
      - name: Fetch benchmark models
        run: ./bench/fetch_models.sh
      - name: Check benchmarks
        run: ./bench/run.py --check bench/baseline-linux.json

  macos-upload:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --locked --release --manifest-path rust/Cargo.toml -p retopo
      - name: Run Rust tests (module goldens + CLI contract)
        run: cargo test --locked --release --manifest-path rust/Cargo.toml
      - name: Fetch benchmark models
        run: ./bench/fetch_models.sh
      - name: Check benchmarks
        run: ./bench/run.py --check bench/baseline.json
      - name: Headless CLI smoke test
        run: |
          set -e
          ./rust/target/release/retopo \
            --input bench/models/armadillo.obj \
            --output retopo-cli-smoke.obj \
            --target-quads 2000
          test -f retopo-cli-smoke.obj
      - name: Assemble Blender extension zip
        run: |
          set -e
          rm -rf blender/retopoforge/__pycache__
          cd blender && zip -r -X ../retopoforge-blender-extension.zip retopoforge
      # The Rust binary is self-contained (pure Rust, no static C++
      # since the item-6 flip); the Homebrew formula is the managed install.
      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: retopoforge-${{ github.ref_name }}-macos-cli
          path: rust/target/release/retopo
      - name: Upload Blender extension
        uses: actions/upload-artifact@v4
        with:
          name: retopoforge-blender-extension.zip
          path: retopoforge-blender-extension.zip
