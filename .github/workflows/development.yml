name: development

on:
  push:
    branches:
      - main
      - ci
    tags:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --all --check --manifest-path rust/Cargo.toml
      - name: Build release binary
        run: cargo build --locked --release --manifest-path rust/Cargo.toml -p retopo
      - name: Run Rust tests (module goldens + CLI contract)
        run: cargo test --locked --release --manifest-path rust/Cargo.toml
      - name: Fetch benchmark models
        run: ./bench/fetch_models.sh
      - name: Check benchmarks
        run: ./bench/run.py --check bench/baseline.json
