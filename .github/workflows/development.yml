name: development

on:
  push:
    branches:
      - main
      - ci
    tags:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  clang-format-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          brew update
          brew install clang-format
      - name: Run clang-format
        run: cd ${GITHUB_WORKSPACE}/ci && sh ./lint.sh && cd ${GITHUB_WORKSPACE}
      - name: Check for changes
        run: |
          if ! git diff --ignore-space-at-eol --exit-code; then
            exit 1
          fi

  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        run: |
          brew install qtbase
      - name: Install LLVM and Ninja
        run: |
          brew install llvm ninja
      - name: Install TBB
        run: |
          brew install tbb
      - name: Build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/macos-llvm.cmake \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Fetch benchmark models
        run: ./bench/fetch_models.sh
      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  macos-bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        run: |
          brew install qtbase
      - name: Install LLVM and Ninja
        run: |
          brew install llvm ninja
      - name: Install TBB
        run: |
          brew install tbb
      - name: Build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/macos-llvm.cmake \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Bundle unsigned app (deploy Qt + vendor dylibs + ad-hoc sign)
        run: |
          export PATH="$(brew --prefix qtbase)/bin:$PATH"
          ./ci/macos_bundle.sh "${GITHUB_WORKSPACE}/build/app/retopoforge.app"
      - name: Verify bundle is self-contained
        run: |
          EXE="${GITHUB_WORKSPACE}/build/app/retopoforge.app/Contents/MacOS/retopoforge"
          test -x "$EXE"
          leftovers=$(otool -L "$EXE" | grep -E '/opt/homebrew/|/usr/local/' || true)
          test -z "$leftovers"
          codesign --verify --deep "${GITHUB_WORKSPACE}/build/app/retopoforge.app"
      # Signing stub: intentionally skipped. No Apple signing identity
      # exists in CI, so the bundle above stays ad-hoc signed (dev only).
      # Owner: to enable release signing, provision an
      # APPLE_DEVELOPER_IDENTITY secret (Developer ID Application identity
      # + certificate) and flip this step's `if:` to true.
      - name: "SKIPPED: Developer-ID signing (needs APPLE_DEVELOPER_IDENTITY secret)"
        if: false
        run: |
          codesign --force --deep --options runtime \
            --sign "${{ secrets.APPLE_DEVELOPER_IDENTITY }}" \
            "${GITHUB_WORKSPACE}/build/app/retopoforge.app"
          codesign --verify --deep "${GITHUB_WORKSPACE}/build/app/retopoforge.app"