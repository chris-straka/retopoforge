name: development

on:
  push:
    branches:
      - main
      - ci
    tags:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  clang-format-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          brew update
          brew install clang-format
      - name: Run clang-format
        run: cd ${GITHUB_WORKSPACE}/ci && sh ./lint.sh && cd ${GITHUB_WORKSPACE}
      - name: Check for changes
        run: |
          if ! git diff --ignore-space-at-eol --exit-code; then
            exit 1
          fi

  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        run: |
          brew install qtbase
      - name: Install LLVM and Ninja
        run: |
          brew install llvm ninja
      - name: Install TBB
        run: |
          brew install tbb
      - name: Build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/macos-llvm.cmake \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Fetch benchmark models
        run: ./bench/fetch_models.sh
      - name: Run tests
        run: ctest --test-dir build --output-on-failure